<head>

<title>Simulador: trabajo en caliente cerca de solventes</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#66655f;--bd:#d9d7cf;--ac:#b4520f;--ok:#1b7a43;--okbg:#e4f3ea;--no:#b3261e;--nobg:#fbe9e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171715;--card:#222220;--tx:#f0efe9;--mu:#a3a29a;--bd:#3a3a36;--ac:#f0914a;--ok:#5fd08a;--okbg:#18301f;--no:#ff8a80;--nobg:#3a1f1c}}
:root[data-theme="dark"]{--bg:#171715;--card:#222220;--tx:#f0efe9;--mu:#a3a29a;--bd:#3a3a36;--ac:#f0914a;--ok:#5fd08a;--okbg:#18301f;--no:#ff8a80;--nobg:#3a1f1c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 40px}
main{max-width:680px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--mu);font-size:.88rem;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.pic{display:block;width:100%;height:auto;border-radius:8px;margin-bottom:14px}
.tag{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ac);margin-bottom:6px}
.card h2{font-size:1.1rem;margin:0 0 8px}
.card p{margin:0 0 6px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-top:10px;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--ac);outline:none}
.opt b{color:var(--ac);margin-right:6px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--bd)}
.steps span.on{background:var(--ac)}
.res{border-left:5px solid}
.res.ok .btn{background:#1b7a43;color:#fff}
.res.ok{background:var(--okbg);border-color:var(--ok)}
.res.no{background:var(--nobg);border-color:var(--no)}
.res h2{margin-top:0}
.ok h2{color:var(--ok)}.no h2{color:var(--no)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-weight:600;width:34%}
ol{padding-left:20px;margin:6px 0}
li{margin-bottom:8px}
.mu{color:var(--mu);font-size:.85rem}
.btn{font:inherit;font-weight:600;color:#fff;background:var(--ac);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Trabajo en caliente cerca de solventes</h1>
<p class="sub">Simulador de decisión · Gestión de Riesgos. Caso ilustrativo: los valores y procedimientos reales dependen de la normativa y de cada planta.</p>
<div class="steps" id="steps"></div>
<div id="app"></div>
</main>

function alarmStart(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!AU.c)AU.c=new C();var c=AU.c;if(c.resume)c.resume();AU.on=true;var k=++AU.k;var n=Math.floor(c.sampleRate*0.9),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);var ns=c.createBufferSource();ns.buffer=buf;var lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;var ng=c.createGain();ng.gain.value=0.9;ns.connect(lp);lp.connect(ng);ng.connect(c.destination);ns.start();var o=c.createOscillator();o.type='sawtooth';o.frequency.value=640;var g=c.createGain();g.gain.value=0.07;o.connect(g);g.connect(c.destination);o.start();AU.o=o;var hi=false;AU.t=setInterval(function(){hi=!hi;o.frequency.setTargetAtTime(hi?960:640,c.currentTime,0.02)},450);setTimeout(function(){speak(k)},700)}catch(e){}setBtn()}
function chime(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!AU.c)AU.c=new C();var c=AU.c;if(c.resume)c.resume();[523.25,659.25,783.99,1046.5].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*0.16;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+(i===3?0.9:0.3));o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+1)});if(window.speechSynthesis){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance('Certificado firmado. Trabajo seguro. Puede continuar.');u.lang='es-AR';u.pitch=1.1;setTimeout(function(){speechSynthesis.speak(u)},900)}}catch(e){}}
function alarmStop(){AU.on=false;AU.k++;clearInterval(AU.t);try{if(AU.o){AU.o.stop();AU.o=null}}catch(e){}try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}setBtn()}
var path=[],app=document.getElementById("app"),stepsEl=document.getElementById("steps");
function steps(k){var s="";for(var i=0;i<3;i++)s+='<span class="'+(i<k?"on":"")+'"></span>';stepsEl.innerHTML=s}
function show(id){alarmStop();
 if(N[id]){var n=N[id];steps(+id[1]);
  var h='<div class="card">'+(n.img?'<img class="pic" src="'+n.img+'" alt="'+n.alt+'">':n.svg?'<div class="pic" role="img" aria-label="'+n.alt+'">'+n.svg+'</div>':'')+'<span class="tag">'+n.t+'</span><h2>'+n.h+'</h2><p>'+n.p+'</p>';
  n.o.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'"><b>'+"ABC"[i]+'.</b>'+o.l+'</button>'});
  app.innerHTML=h+'</div>';
  app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){var o=n.o[+b.dataset.i];path.push({n:n.t,l:o.l,f:o.f,k:id+"ABC"[+b.dataset.i]});show(o.n)}});
 }else{final(id)}}
function final(id){
 steps(3);var r=F[id],last=path[path.length-1].k,hv=H[last]||H.N1B;
 var h='<div class="card res '+r.c+'">'+(r.svg?'<div role="img" aria-label="Ilustración de peligro: incendio durante el trabajo en caliente">'+r.svg+'</div>':'')+'<h2>'+r.h+'</h2><p>'+r.p+'</p>'+((id==='F2'||id==='F1')?'<button class="btn" id="snd" style="margin-top:8px"></button>':'')+'</div>';
 h+='<div class="card"><span class="tag">Tu recorrido</span><ol>';
 path.forEach(function(s){h+='<li><b>'+s.n+':</b> '+s.l+'<br><span class="mu">'+s.f+'</span></li>'});
 h+='</ol></div><div class="card"><span class="tag">Lo que no veías</span><div class="tbl"><table>';
 ["Concentración de vapores","Permiso","Ventilación","Vigía de fuego"].forEach(function(v,i){h+='<tr><th>'+v+'</th><td>'+hv[i]+'</td></tr>'});
 h+='</table></div><p class="mu" style="margin-top:10px">Caso ilustrativo. Los valores y procedimientos reales dependen de la normativa y de cada planta.</p></div>';
 h+='<button class="btn" id="r">Volver a empezar</button>';
 app.innerHTML=h;document.getElementById("r").onclick=function(){path=[];show("N1")};if(id==='F2'){document.getElementById('snd').onclick=function(){if(AU.on)alarmStop();else alarmStart()};alarmStart()}if(id==='F1'){var sb=document.getElementById('snd');sb.textContent='\ud83d\udd0a Repetir aprobaci\u00f3n';sb.onclick=chime;chime()}}
show("N1");
</script>
